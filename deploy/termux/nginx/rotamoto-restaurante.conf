server {
    listen 127.0.0.1:8081;
    server_name localhost;

    root /data/data/com.termux/files/home/projetos/repos/rota-moto-restaurante;
    index index.html;
    autoindex off;

    location = /api/health/live {
        proxy_pass http://127.0.0.1:8788/health/live;
        proxy_set_header Host 127.0.0.1;
    }
    location = /api/health/ready {
        proxy_pass http://127.0.0.1:8788/health/ready;
        proxy_set_header Host 127.0.0.1;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = / {
        include rotamoto-security-headers.conf;
        try_files /index.html =404;
    }
    location = /index.html {
        include rotamoto-security-headers.conf;
        try_files $uri =404;
    }
    location = /manifest.json {
        include rotamoto-security-headers.conf;
        try_files $uri =404;
    }
    location ~ ^/(?:vendor/leaflet|vendor/[^/]+|icons)/ {
        location ~ \.(?:js|css|png|jpg|jpeg|svg|webp|woff2?)$ {
            include rotamoto-security-headers.conf;
            try_files $uri =404;
        }
    }
    location ~ ^/[a-zA-Z0-9_-]+\.(?:js|css|svg|png|ico)$ {
        include rotamoto-security-headers.conf;
        try_files $uri =404;
    }
    location = /sw.js {
        include rotamoto-security-headers.conf;
        try_files $uri =404;
    }
    location / { return 404; }
}
